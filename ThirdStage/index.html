<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>第三關 / Final Driver</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #05070c;
      color: #f8fbff;
      font-family: "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    .stage {
      position: fixed;
      inset: 0;
      z-index: -2;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.72;
    }
    .shade {
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        linear-gradient(90deg, rgba(4, 6, 13, 0.88), rgba(4, 6, 13, 0.32)),
        linear-gradient(0deg, rgba(4, 6, 13, 0.9), rgba(4, 6, 13, 0.16), rgba(4, 6, 13, 0.54));
    }
    main {
      width: min(720px, calc(100% - 40px));
      padding: 28px;
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 8px;
      background: rgba(8, 12, 22, 0.66);
      backdrop-filter: blur(12px);
    }
    p, h1 { margin: 0; }
    .eyebrow {
      color: #9ed9ff;
      font-size: 13px;
      font-weight: 850;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    h1 {
      margin-top: 10px;
      font-size: clamp(42px, 8vw, 76px);
      line-height: 1;
      letter-spacing: 0;
    }
    .copy {
      margin-top: 18px;
      color: rgba(235, 242, 255, 0.74);
      font-size: 17px;
      line-height: 1.75;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
    }
    a {
      display: inline-flex;
      align-items: center;
      min-height: 48px;
      padding: 0 18px;
      border: 1px solid rgba(255, 255, 255, 0.26);
      border-radius: 8px;
      color: #f8fbff;
      background: rgba(5, 8, 16, 0.5);
      text-decoration: none;
      font-weight: 850;
    }
    a.primary {
      border-color: rgba(255, 74, 61, 0.8);
      background: linear-gradient(90deg, rgba(189, 31, 34, 0.9), rgba(255, 121, 58, 0.56));
    }
    a:hover, a:focus-visible {
      border-color: rgba(255, 211, 122, 0.82);
      outline: none;
    }
  </style>
</head>
<body>
  <img class="stage" src="../assets/level-select-bg.png" alt="">
  <div class="shade" aria-hidden="true"></div>
  <main>
    <p class="eyebrow">Stage 03</p>
    <h1>第三關</h1>
    <p class="copy">第三關玩法目前先保留為完整版流程入口。按下繼續後會接到劇情 test4。</p>
    <div class="actions">
      <a class="primary" href="../Story-Stage/story-stage.html?start=play_test_4&end=play_test_4&return=../index.html%3Flevels%3D1">繼續到劇情 test4</a>
      <a href="../index.html?levels=1">返回關卡選擇</a>
    </div>
  </main>
</body>
</html>
