        <circle cx="0" cy="-134" r="22" fill="#c8c5bd" stroke="#4e565e" stroke-width="5"/>
        <path d="M-18-153 C-42-168-54-190-60-218M18-153 C42-168 54-190 60-218" stroke="#2a2f34" stroke-width="8" fill="none"/>
      </g>
