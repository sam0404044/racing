  <g id="arm-left-far" opacity="0.68" transform="translate(650 390) scale(0.55) rotate(10)">
    <rect x="-48" y="-10" width="96" height="56" rx="10" fill="#5f666b"/>
    <circle cx="0" cy="-28" r="26" fill="#c9c8c1" stroke="#60666d" stroke-width="5"/>
    <circle cx="0" cy="-28" r="12" fill="#a22a22"/>
    <g transform="rotate(-65)">
      <rect x="-14" y="-142" width="28" height="126" rx="12" fill="#d8d5cd" stroke="#656c72" stroke-width="4"/>
      <circle cx="0" cy="-154" r="22" fill="#c9c8c1" stroke="#60666d" stroke-width="5"/>
      <g transform="translate(0 -154) rotate(78)">
        <rect x="-11" y="-105" width="22" height="108" rx="10" fill="#d8d5cd" stroke="#656c72" stroke-width="4"/>
        <circle cx="0" cy="-111" r="18" fill="#c9c8c1" stroke="#60666d" stroke-width="4"/>
      </g>
    </g>
  </g>
  <g id="arm-right-far" opacity="0.68" transform="translate(1270 390) scale(-0.55 0.55) rotate(10)">
    <rect x="-48" y="-10" width="96" height="56" rx="10" fill="#5f666b"/>
    <circle cx="0" cy="-28" r="26" fill="#c9c8c1" stroke="#60666d" stroke-width="5"/>
    <circle cx="0" cy="-28" r="12" fill="#a22a22"/>
    <g transform="rotate(-65)">
      <rect x="-14" y="-142" width="28" height="126" rx="12" fill="#d8d5cd" stroke="#656c72" stroke-width="4"/>
      <circle cx="0" cy="-154" r="22" fill="#c9c8c1" stroke="#60666d" stroke-width="5"/>
      <g transform="translate(0 -154) rotate(78)">
        <rect x="-11" y="-105" width="22" height="108" rx="10" fill="#d8d5cd" stroke="#656c72" stroke-width="4"/>
        <circle cx="0" cy="-111" r="18" fill="#c9c8c1" stroke="#60666d" stroke-width="4"/>
      </g>
    </g>
  </g>

  <!-- Tool carts, tires and tanks sit behind the road end on the side platforms. -->
  <g opacity="0.78">
    <g transform="translate(440 332)">
      <rect x="-58" y="0" width="116" height="62" rx="6" fill="#bd3028" stroke="#60211e" stroke-width="4"/>
      <path d="M-48 18H48M-48 38H48" stroke="#e9e4db" stroke-width="5" opacity="0.65"/>
      <circle cx="-36" cy="70" r="12" fill="#252a2f"/>
      <circle cx="36" cy="70" r="12" fill="#252a2f"/>
    </g>
    <g transform="translate(1485 332)">
      <rect x="-58" y="0" width="116" height="62" rx="6" fill="#bd3028" stroke="#60211e" stroke-width="4"/>
      <path d="M-48 18H48M-48 38H48" stroke="#e9e4db" stroke-width="5" opacity="0.65"/>
      <circle cx="-36" cy="70" r="12" fill="#252a2f"/>
      <circle cx="36" cy="70" r="12" fill="#252a2f"/>
    </g>
    <g fill="#1b1f23" stroke="#63696d" stroke-width="4">
      <ellipse cx="525" cy="404" rx="44" ry="13"/>
      <ellipse cx="525" cy="382" rx="42" ry="12"/>
      <rect x="483" y="382" width="84" height="22"/>
      <ellipse cx="1395" cy="404" rx="44" ry="13"/>
      <ellipse cx="1395" cy="382" rx="42" ry="12"/>
      <rect x="1353" y="382" width="84" height="22"/>
    </g>
  </g>

  <!-- Atmospheric haze, bright center and vignette. -->
  <g filter="url(#haze)" opacity="0.45">
    <ellipse cx="960" cy="382" rx="430" ry="82" fill="#fff4d8"/>
    <ellipse cx="960" cy="428" rx="560" ry="62" fill="#ff6a1a" opacity="0.18"/>
  </g>
  <rect width="1920" height="1080" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2"/>
  <rect width="1920" height="1080" fill="#05070c" opacity="0.13"/>
  <path d="M0 0H1920V1080H0Z" fill="none"/>
</svg>
