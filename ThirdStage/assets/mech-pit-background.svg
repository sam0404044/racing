    <rect x="667" y="90" width="586" height="90" rx="10" fill="#d8d5cd"/>
    <rect x="696" y="112" width="528" height="48" rx="4" fill="url(#redPaint)"/>
    <text x="960" y="148" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="40" fill="#fff8ee" letter-spacing="3">MECH-PIT</text>
    <rect x="1136" y="118" width="58" height="34" fill="url(#checkers)" opacity="0.85"/>
    <rect x="728" y="118" width="42" height="34" rx="20" fill="#f2efe8"/>
    <path d="M748 124 a13 13 0 1 0 0 22 a9 9 0 1 1 0-18Z" fill="#bd3028"/>
    <rect x="815" y="184" width="290" height="40" rx="6" fill="#343a40"/>
    <text x="960" y="211" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#e8ecef">EXIT</text>
    <path d="M842 204h-24m0 0 10-9m-10 9 10 9M1078 204h24m0 0-10-9m10 9-10 9" stroke="#ff6a1a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Structural columns behind the road end. -->
  <g opacity="0.88">
    <g fill="#c9c7bf" stroke="#62686d" stroke-width="5">
      <path d="M330 35H420L455 408H272Z"/>
      <path d="M1500 35H1590L1648 408H1465Z"/>
      <path d="M566 160H625L650 410H525Z" opacity="0.8"/>
      <path d="M1295 160H1354L1395 410H1270Z" opacity="0.8"/>
    </g>
    <path d="M293 236H444M1478 236H1626" stroke="#cf3e35" stroke-width="16" opacity="0.68"/>
    <text x="356" y="194" font-family="Arial Black, sans-serif" font-size="66" fill="#7d858b" opacity="0.5">03</text>
    <text x="1532" y="194" font-family="Arial Black, sans-serif" font-size="66" fill="#7d858b" opacity="0.5">03</text>
  </g>

  <!-- Hanging cables and hoses. -->
  <g fill="none" stroke-linecap="round">
