    <path d="M112 -12 C130 70 105 122 140 183 C169 236 136 300 164 374" stroke="#9e281f" stroke-width="9" opacity="0.74"/>
    <path d="M240 -22 C218 52 252 92 232 151 C205 230 240 305 212 392" stroke="#2d3032" stroke-width="11" opacity="0.65"/>
    <path d="M520 -15 C498 70 575 105 530 175 C491 236 540 288 505 360" stroke="#9e281f" stroke-width="8" opacity="0.65"/>
    <path d="M1420 -18 C1450 58 1405 120 1445 190 C1478 250 1438 306 1474 385" stroke="#15171a" stroke-width="13" opacity="0.68"/>
    <path d="M1630 -14 C1592 62 1648 132 1615 194 C1580 260 1632 318 1588 398" stroke="#a83026" stroke-width="9" opacity="0.78"/>
    <path d="M1814 -20 C1845 62 1808 112 1835 185 C1867 268 1820 326 1855 410" stroke="#1d2024" stroke-width="15" opacity="0.62"/>
    <path d="M740 -10 C730 45 750 91 735 142" stroke="#1a1d20" stroke-width="8" opacity="0.5"/>
    <path d="M1190 -10 C1210 42 1180 90 1198 143" stroke="#94241f" stroke-width="7" opacity="0.56"/>
  </g>

  <!-- Robotic arm symbol: base, joints and segmented metal arms. -->
  <g id="arm-left-near" filter="url(#softShadow)" transform="translate(188 318) rotate(-7)">
    <ellipse cx="0" cy="68" rx="78" ry="18" fill="#171b1f" opacity="0.35"/>
    <rect x="-54" y="30" width="108" height="52" rx="10" fill="#32383e"/>
    <rect x="-40" y="-20" width="80" height="64" rx="12" fill="url(#metal)" stroke="#535b62" stroke-width="4"/>
    <circle cx="0" cy="-24" r="30" fill="#c9c8c1" stroke="#4e565e" stroke-width="5"/>
    <circle cx="0" cy="-24" r="14" fill="#a22a22"/>
    <g transform="rotate(-42)">
      <rect x="-16" y="-178" width="32" height="160" rx="15" fill="url(#metal)" stroke="#4f565c" stroke-width="4"/>
      <rect x="-7" y="-168" width="14" height="138" rx="7" fill="#8f9699" opacity="0.35"/>
      <circle cx="0" cy="-188" r="25" fill="#c5c2bb" stroke="#4e565e" stroke-width="5"/>
      <circle cx="0" cy="-188" r="11" fill="#9f261f"/>
      <g transform="translate(0 -188) rotate(74)">
