<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="Mechanical pit lane background">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d7dde1"/>
      <stop offset="0.42" stop-color="#b9c2c8"/>
      <stop offset="0.68" stop-color="#6e7375"/>
      <stop offset="1" stop-color="#2c2c2b"/>
    </linearGradient>
    <linearGradient id="wallLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2b3035"/>
      <stop offset="0.45" stop-color="#a8adb0"/>
      <stop offset="1" stop-color="#dad9d3"/>
    </linearGradient>
    <linearGradient id="wallRight" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#252a30"/>
      <stop offset="0.42" stop-color="#969da2"/>
      <stop offset="1" stop-color="#ddd9d1"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f0e8"/>
      <stop offset="0.35" stop-color="#b9b9b5"/>
      <stop offset="0.75" stop-color="#70777d"/>
      <stop offset="1" stop-color="#343a40"/>
    </linearGradient>
    <linearGradient id="redPaint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7b1d16"/>
      <stop offset="0.52" stop-color="#d64b3f"/>
      <stop offset="1" stop-color="#8c241c"/>
    </linearGradient>
    <radialGradient id="exitGlow" cx="50%" cy="38%" r="45%">
      <stop offset="0" stop-color="#fff1c8" stop-opacity="0.78"/>
      <stop offset="0.45" stop-color="#ff9d62" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff5a00" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#111315" flood-opacity="0.38"/>
    </filter>
    <filter id="haze">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <pattern id="checkers" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#f4f0e8" opacity="0.7"/>
      <rect x="20" y="20" width="20" height="20" fill="#f4f0e8" opacity="0.7"/>
      <rect x="20" width="20" height="20" fill="#31373c" opacity="0.7"/>
      <rect y="20" width="20" height="20" fill="#31373c" opacity="0.7"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="#24282c"/>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect x="0" y="250" width="1920" height="230" fill="url(#exitGlow)" opacity="0.9"/>
  <path d="M0 0H1920V410H0Z" fill="rgba(255,255,255,0.08)"/>

  <!-- Far desert exit, entirely behind the road horizon. -->
  <g opacity="0.78">
    <path d="M765 326 C840 298 1015 293 1117 318 C1190 336 1235 359 1305 382 L620 382 C665 358 707 344 765 326Z" fill="#d8956a" opacity="0.65"/>
    <path d="M1128 313 C1212 288 1295 302 1388 340 C1430 356 1475 377 1517 400 L980 400 C1015 365 1062 335 1128 313Z" fill="#bd714c" opacity="0.43"/>
    <path d="M680 348 C742 324 825 326 905 350 C955 365 1005 386 1040 410 L520 410 C560 385 608 365 680 348Z" fill="#c9825c" opacity="0.36"/>
  </g>

  <!-- Pit walls and ceiling frame. The lower edges line up near the game horizon. -->
  <path d="M0 0H610L456 410H0Z" fill="url(#wallLeft)"/>
  <path d="M1920 0H1310L1464 410H1920Z" fill="url(#wallRight)"/>
  <path d="M540 0H1380L1288 238H632Z" fill="#b9b7b0"/>
  <path d="M575 20H1345L1274 196H646Z" fill="#565d63" opacity="0.35"/>
  <path d="M602 196H1318L1295 249H625Z" fill="#23282d" opacity="0.8"/>
  <path d="M0 408H864" stroke="#d04536" stroke-width="10" opacity="0.75"/>
  <path d="M1056 408H1920" stroke="#d04536" stroke-width="10" opacity="0.75"/>
  <path d="M0 423H864M1056 423H1920" stroke="#f4f0e8" stroke-width="4" opacity="0.45"/>

  <!-- Overhead gantry. -->
