    <rect x="-54" y="30" width="108" height="52" rx="10" fill="#32383e"/>
    <rect x="-40" y="-20" width="80" height="64" rx="12" fill="url(#metal)" stroke="#535b62" stroke-width="4"/>
    <circle cx="0" cy="-24" r="30" fill="#c9c8c1" stroke="#4e565e" stroke-width="5"/>
    <circle cx="0" cy="-24" r="14" fill="#a22a22"/>
    <g transform="rotate(-42)">
      <rect x="-16" y="-178" width="32" height="160" rx="15" fill="url(#metal)" stroke="#4f565c" stroke-width="4"/>
      <rect x="-7" y="-168" width="14" height="138" rx="7" fill="#8f9699" opacity="0.35"/>
      <circle cx="0" cy="-188" r="25" fill="#c5c2bb" stroke="#4e565e" stroke-width="5"/>
      <circle cx="0" cy="-188" r="11" fill="#9f261f"/>
      <g transform="translate(0 -188) rotate(74)">
