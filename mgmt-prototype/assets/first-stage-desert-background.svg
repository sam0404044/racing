<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Stage 1沙漠背景層</title>
  <desc id="desc">不包含賽道的沙漠遠景背景，含金字塔、棕櫚樹、沙丘、熱浪與少量賽車科技光。</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101f2a"/>
      <stop offset="0.42" stop-color="#b35b2f"/>
      <stop offset="0.72" stop-color="#e4aa62"/>
      <stop offset="1" stop-color="#3B3131"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a552e"/>
      <stop offset="0.52" stop-color="#c8833b"/>
      <stop offset="1" stop-color="#4b2b1c"/>
    </linearGradient>
    <linearGradient id="nearSand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5f3926"/>
      <stop offset="0.48" stop-color="#b86f32"/>
      <stop offset="1" stop-color="#241613"/>
    </linearGradient>
    <linearGradient id="pyramid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0c577"/>
      <stop offset="0.56" stop-color="#a66b31"/>
      <stop offset="1" stop-color="#4a2e20"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.78" cy="0.32" r="0.2">
      <stop offset="0" stop-color="#ffde7a" stop-opacity="0.94"/>
      <stop offset="0.55" stop-color="#FF5A00" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#FF5A00" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="heat">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <pattern id="sandLines" width="180" height="120" patternUnits="userSpaceOnUse">
      <path d="M10 26 C42 18 74 18 110 25 M78 72 C112 64 146 66 170 72 M20 100 C54 92 90 94 122 101" fill="none" stroke="#ffe0a3" stroke-width="3" stroke-linecap="round" opacity="0.16"/>
      <path d="M132 38 H158 M28 58 H48 M86 102 H104" stroke="#321b14" stroke-width="2" stroke-linecap="round" opacity="0.16"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#sun)"/>

