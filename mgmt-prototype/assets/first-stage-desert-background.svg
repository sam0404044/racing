    <path d="M0 250 C180 226 320 280 500 252 S800 226 1010 270 S1310 304 1512 260 S1790 226 1920 256" fill="none" stroke="#FF5A00" stroke-width="4"/>
    <path d="M0 315 C210 288 345 336 548 306 S870 284 1068 324 S1356 354 1552 312 S1798 282 1920 314" fill="none" stroke="#00D9FF" stroke-width="2" opacity="0.34"/>
